[package]
name = "contextos"
version = "1.0.0"
description = "A local-first personal context workspace"
authors = ["ContextOS contributors"]
edition = "2021"

[lib]
name = "contextos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
